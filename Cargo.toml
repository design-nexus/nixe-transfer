[workspace]
members = ["crates/transfer-core", "crates/transfer-rclone", "crates/transfer-storage", "crates/transfer-ipc", "apps/nyx-transfer", "apps/nyx-transferd"]
default-members = ["apps/nyx-transfer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
rusqlite = "0.37"
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
